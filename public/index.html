<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINCI (QUASI) SEMPRE - Tavolo 100 Coperti (Curva Morbida)</title>
<style>
  :root {
    --bg: #12161f;
    --card: #1e2433;
    --gold: #f5b942;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #ecf0f1;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    padding: 15px 25px;
    border-radius: 12px;
    border-bottom: 3px solid var(--gold);
    margin-bottom: 20px;
  }
  h1 { margin: 0; color: var(--gold); font-size: 1.5rem; }
  .stats { display: flex; gap: 20px; font-weight: bold; }
  .stat-box { background: #12161f; padding: 8px 15px; border-radius: 8px; }
  
  /* Pannello Gestore */
  .admin-panel {
    background: #2c1e24;
    border: 1px dashed var(--red);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
  }
  .admin-panel.visible { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:hover { background: #e0a835; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-dark { background: #34495e; color: #fff; }

  /* Griglia 100 Coperti */
  .grid-100 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }
  .cloche {
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    border: 2px solid #2c354b;
    transition: transform 0.2s, border-color 0.2s;
    position: relative;
  }
  .cloche:hover { transform: translateY(-3px); border-color: var(--gold); }
  .cloche.opened { cursor: default; transform: none; }
  .cloche.win { border-color: var(--green); background: rgba(46, 204, 113, 0.15); }
  .cloche.loss { border-color: var(--red); background: rgba(231, 76, 60, 0.15); }
  
  .group-badge {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 0.75rem;
    background: #12161f;
    padding: 2px 6px;
    border-radius: 4px;
    color: #95a5a6;
  }
  .seat-num { font-size: 0.85rem; color: #bdc3c7; margin-bottom: 5px; }
  .dome-icon { font-size: 2rem; margin: 5px 0; }
  .prize { font-size: 1.1rem; font-weight: bold; }
  .win .prize { color: var(--green); }
  .loss .prize { color: var(--red); }
</style>
</head>
<body>

<div id="connection-status" style="margin-bottom:12px;color:#bdc3c7">Connessione al server in corso…</div>
<header>
  <div>
    <h1>🍽️ VINCI (QUASI) SEMPRE</h1>
    <small>Puntata fissa: 5 Gettoni | Tavolo collegato al server</small>
  </div>
  <div class="stats">
    <div class="stat-box">Mano N°: <span id="round-num" style="color:var(--gold)">1</span></div>
    <div class="stat-box">Incasso Tavolo: <span id="table-pot">500.00</span> 🪙</div>
    <button class="btn-dark" onclick="toggleAdmin()">🔑 Area Gestore</button>
  </div>
</header>

<!-- PANNELLO SEGRETO GESTORE -->
<div id="admin-panel" class="admin-panel">
  <div>
    <strong>⚙️ REGIA AMM (Privato):</strong> 
    Cassa Compensazione: <span id="reserve-fund" style="color:var(--gold); font-size:1.2rem;">40.00</span> / 40.00 🪙 | 
    Gruppo penalizzato: <span id="losing-group" style="color:var(--red); font-weight:bold;">E</span>
  </div>
  <div>
    <button class="btn-gold" onclick="revealAll()">👁️ Rivela Tutti i Risultati</button>
    <button class="btn-dark" onclick="nextRound()">➡️ Prossima Giocata (Rotazione)</button>
    <button class="btn-red" onclick="resetSession()">🔄 Ricomincia Sessione</button>
  </div>
</div>

<!-- TAVOLO DA 100 POSTI -->
<div class="grid-100" id="table-grid"></div>

<script>
  const GROUPS = ['A', 'B', 'C', 'D', 'E'];
  const BET = 5.00;
  let sessionId = new URLSearchParams(location.search).get('sessioneId') || '';
  let userId = new URLSearchParams(location.search).get('utenteId') || '';
  let adminKey = '';
  let seatsData = [];
  let currentRound = 1;
  let reserveFund = 0;
  let losingGroup = '-';
  const statusEl = document.getElementById('connection-status');

  async function request(path, options={}) {
    const response = await fetch(path, {headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options});
    let body = {}; try { body = await response.json(); } catch {}
    if (!response.ok) throw new Error(body.error || `Errore HTTP ${response.status}`);
    return body;
  }
  function setStatus(text, ok=true) { statusEl.textContent=text; statusEl.style.color=ok?'#2ecc71':'#e74c3c'; }
  async function setup() {
    if (!sessionId) sessionId = prompt('Inserisci ID sessione di gioco:') || '';
    if (!userId) userId = prompt('Inserisci ID utente giocatore:') || '';
    if (!sessionId) { setStatus('ID sessione mancante. Ricarica e inserisci un ID sessione.',false); return; }
    if (!userId) setStatus('ID giocatore mancante: potrai visualizzare il tavolo, ma non giocare.',false);
    await refreshTable();
  }
  async function refreshTable() {
    try {
      const data = await request(`/api/tavolo/${encodeURIComponent(sessionId)}`);
      currentRound = Number(data.sessione.mano_corrente || 1);
      document.getElementById('round-num').textContent=currentRound;
      seatsData = (data.posti||[]).map(p=>({seat:Number(p.numero_posto),group:p.gruppo,amount:p.vincita===null?null:Number(p.vincita),revealed:Boolean(p.scoperto)}));
      renderTable(); setStatus(`Collegato · Sessione ${sessionId} · Mano ${currentRound}`);
      if (adminKey) refreshAdminState().catch(()=>{});
    } catch(e) { setStatus(`Connessione non riuscita: ${e.message}`,false); }
  }
  function renderTable() {
    const grid=document.getElementById('table-grid'); grid.innerHTML='';
    seatsData.forEach((d,idx)=>{
      const div=document.createElement('div');
      div.className='cloche'+(d.revealed?(d.amount>BET?' opened win':' opened loss'):'');
      div.onclick=()=>playSeat(idx);
      div.innerHTML=`<span class="group-badge">Grp ${d.group}</span><div class="seat-num">Posto #${d.seat}</div><div class="dome-icon">${d.revealed?(d.amount>BET?'🍗':'🦴'):'🛎️'}</div><div class="prize">${d.revealed?d.amount.toFixed(2).replace('.',',')+' 🪙':'Puntata 5 🪙'}</div>`;
      grid.appendChild(div);
    });
  }
  async function playSeat(idx) {
    const seat=seatsData[idx]; if(!seat || seat.revealed) return;
    if(!userId) { alert('Inserisci l’ID giocatore nell’indirizzo o ricarica la pagina per configurarlo.'); return; }
    if(!confirm(`Confermi la giocata al posto #${seat.seat} (puntata 5 gettoni)?`)) return;
    try { const result=await request('/api/gioca',{method:'POST',body:JSON.stringify({sessioneId,numeroPosto:seat.seat,utenteId:userId})}); alert(`Giocata effettuata! Vincita: ${Number(result.vincita).toFixed(2)} gettoni. Saldo: ${Number(result.nuovoSaldo).toFixed(2)}`); await refreshTable(); }
    catch(e){alert(e.message);}
  }
  async function adminRequest(path) { return request(path,{method:'POST',headers:{'x-admin-key':adminKey}}); }
  async function toggleAdmin() {
    if(!adminKey) { adminKey=prompt('Chiave privata gestore (ADMIN_KEY):')||''; if(!adminKey)return; }
    try { await refreshAdminState(); document.getElementById('admin-panel').classList.toggle('visible'); }
    catch(e){ adminKey=''; alert(`Accesso gestore negato: ${e.message}`); }
  }
  async function refreshAdminState() {
    const state=await request(`/api/admin/stato/${encodeURIComponent(sessionId)}`,{headers:{'x-admin-key':adminKey}});
    reserveFund=Number(state.cassa_compensazione||0); losingGroup=state.gruppo_penalizzato||'-';
    document.getElementById('reserve-fund').textContent=reserveFund.toFixed(2);
    document.getElementById('losing-group').textContent=losingGroup;
    document.getElementById('round-num').textContent=state.mano_corrente;
  }
  async function revealAll(){try{await adminRequest(`/api/admin/rivela-tutti/${encodeURIComponent(sessionId)}`);await refreshTable();}catch(e){alert(e.message);}}
  async function nextRound(){if(!confirm('Passare alla mano successiva?'))return;try{await adminRequest(`/api/admin/prossima-mano/${encodeURIComponent(sessionId)}`);await refreshTable();await refreshAdminState();}catch(e){alert(e.message);}}
  async function resetSession(){if(!confirm('Confermi il riavvio della sessione e il reset della cassa?'))return;try{await adminRequest(`/api/admin/ricomincia/${encodeURIComponent(sessionId)}`);await refreshTable();await refreshAdminState();}catch(e){alert(e.message);}}
  setup();
</script>
</body>
</html>
